name: Strip trailing newlines

on:
  push:
    paths:
      - ".github/workflows/strip-newlines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["package.json", ".makefun/owner.json"]:
              p = Path(name)
              data = p.read_bytes()
              if data.endswith(b"\n"):
                  p.write_bytes(data[:-1])
          PY
      - name: Commit stripped files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Strip trailing newlines from package.json and .makefun/owner.json"
          git push
